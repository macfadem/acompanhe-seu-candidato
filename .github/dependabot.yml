version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      desenvolvimento:
        dependency-type: development
    ignore:
      # Os tipos do Node acompanham a menor versão suportada (22): não subir de versão maior.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
