name: Inspeção das listas de parlamentares (temporário)

on:
  push:
    branches: [vinculo-tse]

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspecionar (só nomes de colunas e campos públicos)
        shell: python3 {0}
        run: |
          import csv, io, json, urllib.request
          SEGUROS = {'id','uri','nome','nomeCivil','siglaUf','siglaPartido','idLegislatura','idLegislaturaInicial','idLegislaturaFinal',
                     'CodigoParlamentar','NomeParlamentar','NomeCompletoParlamentar','SiglaPartidoParlamentar','UfParlamentar','DescricaoParticipacao'}
          def nota(t, m):
              m = str(m)[:3500].replace('%','%25').replace('\r','').replace('\n','%0A')
              print(f"::notice title={t}::{m}")
          def get(url, accept='application/json'):
              req = urllib.request.Request(url, headers={'Accept': accept, 'User-Agent': 'acompanhe-seu-candidato (inspecao)'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read(), r.headers.get('content-type')
          def seguro(d):
              return {k: v for k, v in d.items() if k in SEGUROS}
          # 1. CSV de todos os deputados
          try:
              corpo, tipo = get('https://dadosabertos.camara.leg.br/arquivos/deputados/csv/deputados.csv', 'text/csv')
              texto = corpo.decode('utf-8-sig', errors='replace')
              linhas = list(csv.reader(io.StringIO(texto), delimiter=';'))
              cab = linhas[0]
              idx = {c: i for i, c in enumerate(cab)}
              amostra = [{c: l[idx[c]] for c in cab if c in SEGUROS and idx[c] < len(l)} for l in linhas[1:3]]
              finais = {}
              for l in linhas[1:]:
                  if 'idLegislaturaFinal' in idx and idx['idLegislaturaFinal'] < len(l):
                      finais[l[idx['idLegislaturaFinal']]] = finais.get(l[idx['idLegislaturaFinal']], 0) + 1
              nota('Câmara deputados.csv', f'{tipo}; {len(linhas)-1} linhas; colunas: {cab}\namostra (campos públicos): {amostra}\nidLegislaturaFinal: {sorted(finais.items())[-5:]}')
          except Exception as e:
              nota('Câmara deputados.csv — erro', repr(e))
          # 2. API: deputados da legislatura 57
          try:
              corpo, _ = get('https://dadosabertos.camara.leg.br/api/v2/deputados?idLegislatura=57&itens=100&ordem=ASC&ordenarPor=nome')
              d = json.loads(corpo)
              ultimo = [l['href'] for l in d.get('links', []) if l.get('rel') == 'last']
              nota('Câmara /deputados?idLegislatura=57', f"chaves: {list(d['dados'][0].keys())}\namostra: {seguro(d['dados'][0])}\nlast: {ultimo}")
              ident = d['dados'][0]['id']
              corpo, _ = get(f'https://dadosabertos.camara.leg.br/api/v2/deputados/{ident}')
              det = json.loads(corpo)['dados']
              nota('Câmara /deputados/{id}', f"chaves: {list(det.keys())}\nultimoStatus: {list((det.get('ultimoStatus') or {}).keys())}\nnomeCivil presente: {'nomeCivil' in det}")
          except Exception as e:
              nota('Câmara API — erro', repr(e))
          # 3. Senado
          for caminho in ['senador/lista/atual', 'senador/lista/legislatura/57']:
              for url in [f'https://legis.senado.leg.br/dadosabertos/{caminho}', f'https://legis.senado.leg.br/dadosabertos/{caminho}.json']:
                  try:
                      corpo, tipo = get(url)
                      d = json.loads(corpo)
                      raiz = list(d.keys())
                      # desce até a lista de parlamentares
                      no = d[raiz[0]]
                      caminho_chaves = [raiz[0]]
                      while isinstance(no, dict):
                          k = 'Parlamentares' if 'Parlamentares' in no else ('Parlamentar' if 'Parlamentar' in no else None)
                          if k is None: break
                          caminho_chaves.append(k); no = no[k]
                      lista = no if isinstance(no, list) else []
                      p = lista[0] if lista else {}
                      ident = p.get('IdentificacaoParlamentar', {})
                      nota(f'Senado {caminho} ({url.endswith(".json") and ".json" or "Accept"})',
                           f'{tipo}; caminho: {caminho_chaves}; {len(lista)} itens; chaves do item: {list(p.keys())}\nIdentificacaoParlamentar: {list(ident.keys())}\namostra: {seguro(ident)}\nMandato: {list((p.get("Mandato") or {}).keys()) if isinstance(p.get("Mandato"), dict) else type(p.get("Mandato")).__name__}')
                      break
                  except Exception as e:
                      nota(f'Senado {caminho} — erro em {url[-30:]}', repr(e)[:300])
