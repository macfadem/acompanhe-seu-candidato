name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres descartável para o teste de integração do driver `pg`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          # Banco do serviço acima (descartável, só existe durante o job). Não é segredo.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Prova, na página da execução, que a integração rodou: os testes deixam dados no banco do serviço.
      - name: Conferir a integração com Postgres
        working-directory: packages/pipeline
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          n=$(node --input-type=module -e "
            import pg from 'pg';
            const c = new pg.Client(process.env.TEST_DATABASE_URL);
            await c.connect();
            const { rows } = await c.query('select count(*)::int as n from public.voto');
            console.log(rows[0].n);
            await c.end();")
          if [ "$n" -gt 0 ]; then
            echo "::notice title=Integração pg::Os testes gravaram $n votos num Postgres de verdade pelo driver pg."
          else
            echo "::error title=Integração pg::Nenhum voto no banco do CI — os testes de integração não rodaram."
            exit 1
          fi
